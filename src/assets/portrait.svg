<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background studio gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="60%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- Key & Rim Lighting Gradients -->
    <linearGradient id="rimLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#dc143c" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rimRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff4757" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="45%" y1="20%" x2="55%" y2="80%">
      <stop offset="0%" stop-color="#d49b72" />
      <stop offset="40%" stop-color="#c58b63" />
      <stop offset="75%" stop-color="#a86e49" />
      <stop offset="100%" stop-color="#8a5333" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#1c1c22" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="50%" stop-color="#131318" />
      <stop offset="100%" stop-color="#0c0c10" />
    </linearGradient>

    <linearGradient id="shirtGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0f2f5" />
      <stop offset="100%" stop-color="#b0b5c0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Studio Background -->
  <rect width="1200" height="800" fill="url(#bgGlow)" />

  <!-- Studio Rim Backlight -->
  <circle cx="600" cy="380" r="260" fill="#dc143c" opacity="0.12" filter="url(#softGlow)" />

  <g id="portrait-bust" transform="translate(0, 30)">
    <!-- Shoulders & Suit Jacket -->
    <!-- Left Shoulder -->
    <path d="M 330 750 C 340 600, 420 540, 520 525 L 535 640 L 400 750 Z" fill="url(#suitGrad)" />
    <!-- Right Shoulder -->
    <path d="M 870 750 C 860 600, 780 540, 680 525 L 665 640 L 800 750 Z" fill="url(#suitGrad)" />
    <!-- Center Chest / Lapels -->
    <path d="M 460 750 L 530 525 L 600 660 L 670 525 L 740 750 Z" fill="#15151c" />

    <!-- Crisp White Collar / Shirt -->
    <polygon points="560,525 600,620 575,630 535,530" fill="url(#shirtGrad)" />
    <polygon points="640,525 600,620 625,630 665,530" fill="url(#shirtGrad)" />
    <polygon points="590,550 600,660 610,550" fill="#dc143c" /> <!-- Crimson necktie accent -->

    <!-- Neck -->
    <path d="M 545 440 L 540 535 C 570 548, 630 548, 660 535 L 655 440 Z" fill="url(#skinGrad)" />
    <!-- Neck shadow under chin -->
    <ellipse cx="600" cy="450" rx="45" ry="15" fill="#6e3e22" opacity="0.45" />

    <!-- Head / Face Oval -->
    <!-- Jaw & Chin Contour -->
    <path d="M 515 320 C 510 430, 545 470, 600 470 C 655 470, 690 430, 685 320 C 685 240, 655 200, 600 200 C 545 200, 515 240, 515 320 Z" fill="url(#skinGrad)" />

    <!-- Left & Right Ears -->
    <ellipse cx="510" cy="340" rx="14" ry="24" fill="#bd825b" />
    <ellipse cx="690" cy="340" rx="14" ry="24" fill="#bd825b" />

    <!-- Modern Styled Hair -->
    <path d="M 505 310 C 500 220, 530 160, 600 155 C 670 160, 700 220, 695 310 C 680 270, 670 240, 600 235 C 530 240, 520 270, 505 310 Z" fill="url(#hairGrad)" />
    <path d="M 515 230 C 550 180, 650 175, 685 220 C 655 205, 545 205, 515 230 Z" fill="#252530" />

    <!-- Eyebrows -->
    <path d="M 535 305 Q 560 295 580 305" stroke="#252528" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 665 305 Q 640 295 620 305" stroke="#252528" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Eyes (Confident, friendly looking into camera) -->
    <!-- Left Eye -->
    <ellipse cx="558" cy="324" rx="14" ry="8" fill="#ffffff" />
    <circle cx="558" cy="324" r="5.5" fill="#2c1d11" />
    <circle cx="556" cy="322" r="2" fill="#ffffff" />
    <path d="M 544 322 Q 558 314 572 322" stroke="#452715" stroke-width="2.5" fill="none" />

    <!-- Right Eye -->
    <ellipse cx="642" cy="324" rx="14" ry="8" fill="#ffffff" />
    <circle cx="642" cy="324" r="5.5" fill="#2c1d11" />
    <circle cx="640" cy="322" r="2" fill="#ffffff" />
    <path d="M 628 322 Q 642 314 656 322" stroke="#452715" stroke-width="2.5" fill="none" />

    <!-- Nose -->
    <path d="M 598 315 L 595 370 Q 600 376 605 370 L 602 315" fill="#b0744d" opacity="0.35" />
    <ellipse cx="600" cy="374" rx="8" ry="3.5" fill="#8c5332" opacity="0.6" />

    <!-- Gentle Confident Smile -->
    <path d="M 568 412 Q 600 430 632 412" stroke="#7a3720" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 576 414 Q 600 422 624 414" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Glasses Frame (Optional, sleek professional aesthetic) -->
    <rect x="535" y="310" width="46" height="28" rx="6" fill="none" stroke="#222" stroke-width="2.2" opacity="0.85" />
    <rect x="619" y="310" width="46" height="28" rx="6" fill="none" stroke="#222" stroke-width="2.2" opacity="0.85" />
    <line x1="581" y1="322" x2="619" y2="322" stroke="#222" stroke-width="2.2" opacity="0.85" />

    <!-- Studio Rim Light Edges (Left & Right) -->
    <path d="M 515 320 C 510 430, 545 470, 600 470" stroke="url(#rimLeft)" stroke-width="4.5" fill="none" />
    <path d="M 685 320 C 690 430, 655 470, 600 470" stroke="url(#rimRight)" stroke-width="4.5" fill="none" />
    <path d="M 330 750 C 340 600, 420 540, 520 525" stroke="url(#rimLeft)" stroke-width="5" fill="none" />
    <path d="M 870 750 C 860 600, 780 540, 680 525" stroke="url(#rimRight)" stroke-width="5" fill="none" />
  </g>

  <!-- Vignette / Bottom fade -->
  <rect y="680" width="1200" height="120" fill="url(#bgGlow)" opacity="0.9" />
</svg>

